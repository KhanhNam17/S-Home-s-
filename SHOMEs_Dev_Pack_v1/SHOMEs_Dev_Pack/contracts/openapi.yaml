components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-shomes_sid
      description: HTTPS opaque guest/authenticated session
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: shomes_sid
      description: Local HTTP only
  schemas:
    Empty:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    Ack:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - true
      required:
      - ok
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
      additionalProperties: false
    Meta:
      type: object
      properties:
        requestId:
          type: string
        generatedAt:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
          maximum: 1000000
        totalPages:
          type: integer
          minimum: 0
          maximum: 1000000
        mapTruncated:
          type: boolean
        travelIncomplete:
          type: boolean
      required:
      - requestId
      - generatedAt
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
