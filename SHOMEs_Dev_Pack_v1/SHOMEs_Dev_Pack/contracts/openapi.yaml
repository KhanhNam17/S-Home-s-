  /listings:
    get:
      operationId: searchListings
      summary: Search/list/map chung predicate
      tags:
      - listings
      x-role: public
      security: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: areaCode
        in: query
        required: false
        schema:
          type: string
      - name: budgetType
        in: query
        required: false
        schema:
          type: string
          enum:
          - rent
          - total
          default: rent
      - name: minPriceVnd
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000000
      - name: maxPriceVnd
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000000
      - name: minAreaM2
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 1000
          exclusiveMinimum: true
      - name: maxAreaM2
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 1000
          exclusiveMinimum: true
      - name: amenities
        in: query
        required: false
        schema:
          type: string
          description: Comma-separated allowlisted codes
      - name: occupants
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
      - name: vehicles
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10
          default: 1
      - name: electricityKwh
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2000
          default: 80
      - name: destinationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: maxTravelMinutes
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 180
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - newest
          - rent_asc
          - total_asc
          - area_desc
          - travel_asc
          default: newest
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: includeMap
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: bbox
        in: query
        required: false
        schema:
          type: string
          description: west,south,east,north
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SearchResult'
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                      generatedAt:
                        type: string
                        format: date-time
                      page:
                        type: integer
                        minimum: 1
                        maximum: 1000000
                      pageSize:
                        type: integer
                        minimum: 1
                        maximum: 50
                      total:
                        type: integer
                        minimum: 0
                        maximum: 1000000
                      totalPages:
                        type: integer
                        minimum: 0
                        maximum: 1000000
                      mapTruncated:
                        type: boolean
                      travelIncomplete:
                        type: boolean
                    required:
                    - requestId
                    - generatedAt
                    - page
                    - pageSize
                    - total
                    - totalPages
                    - mapTruncated
                    - travelIncomplete
                    additionalProperties: false
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          description: Invalid input or unknown field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role or CSRF rejected
          content:
