                - meta
                additionalProperties: false
        '400':
          description: Invalid input or unknown field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role or CSRF rejected
          content:
            application/json:
